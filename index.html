<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rheme18 | Elite Open-Source Developer</title>
    <meta name="description" content="Official developer portfolio of rheme18. Creator of RhemeSetup and high-performance system utilities.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Arka Plan Canlı Parıltı Efektleri */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            z-index: -1;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(147,51,234,0.1) 0%, rgba(0,0,0,0) 70%);
            bottom: -150px;
            right: -150px;
            z-index: -1;
            animation: floatGlow 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatGlow {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        header {
            padding: 2rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .social-links {
            display: flex;
            gap: 1.25rem;
        }

        .social-links a {
            color: var(--text-secondary);
            font-size: 1.25rem;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            color: var(--accent-color);
            transform: translateY(-2px);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        main {
            max-width: 1100px;
            width: 90%;
            margin: 0 auto;
            padding: 4rem 0;
            flex-grow: 1;
        }

        .hero {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeIn 1s ease-out;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .section-title {
            font-size: 1.75rem;
            margin-bottom: 2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background-color: var(--accent-color);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--accent-color);
        }

        /* Repoların Grid Tasarımı */
        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .repo-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.75rem;
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .repo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .repo-card:hover {
            transform: translateY(-6px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.2);
        }

        .repo-card:hover::before {
            opacity: 1;
        }

        .repo-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .repo-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .repo-name:hover {
            color: var(--accent-color);
        }

        .repo-desc {
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .repo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .repo-lang {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .lang-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-color);
        }

        .repo-stars {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .loading-text, .error-text {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-secondary);
            padding: 3rem;
            font-size: 1.1rem;
        }

        footer {
            text-align: center;
            padding: 2.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.85rem;
            background: rgba(7, 9, 14, 0.8);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.4rem; }
            header { padding: 1.5rem 5%; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <header>
        <a href="#" class="logo">rheme<span>18</span></a>
        <div class="social-links">
            <a href="https://github.com/rheme18" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
            <a href="https://instagram.com/rhcorleone" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://tiktok.com/@rheme181" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Independent Open-Source Developer</h1>
            <p>Building high-performance, lightweight, and modern utility software for power users. Focused on clean architecture and optimization.</p>
        </section>

        <section>
            <h2 class="section-title">Repositories</h2>
            <div id="repos-container" class="repos-grid">
                <div class="loading-text">Fetching repositories from GitHub...</div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 rheme18. Built with elite engineering.</p>
    </footer>

    <script>
        async function fetchGitHubRepos() {
            const container = document.getElementById('repos-container');
            try {
                const response = await fetch('https://api.github.com/users/rheme18/repos?sort=updated&per_page=12');
                if (!response.ok) throw new Error('Failed to fetch repositories');
                
                const repos = await response.json();
                
                if (repos.length === 0) {
                    container.innerHTML = '<div class="error-text">No public repositories found.</div>';
                    return;
                }

                container.innerHTML = '';

                repos.forEach(repo => {
                    if (repo.fork) return; // Forkları filtrelemek istersen bırakabilirsin

                    const card = document.createElement('div');
                    card.className = 'repo-card';

                    const description = repo.description ? repo.description : 'No description provided for this repository.';
                    const language = repo.language ? repo.language : 'Code';
                    const stars = repo.stargazers_count;

                    card.innerHTML = `
                        <div>
                            <div class="repo-header">
                                <a href="${repo.html_url}" target="_blank" class="repo-name">
                                    <i class="far fa-folder-open" style="color: var(--accent-color);"></i> ${repo.name}
                                </a>
                            </div>
                            <p class="repo-desc">${description}</p>
                        </div>
                        <div class="repo-footer">
                            <span class="repo-lang">
                                <span class="lang-dot"></span> ${language}
                            </span>
                            <span class="repo-stars">
                                <i class="far fa-star"></i> ${stars}
                            </span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = `<div class="error-text">Could not load repositories at the moment. Check out <a href="https://github.com/rheme18" target="_blank" style="color: var(--accent-color);">GitHub Profile</a> directly.</div>`;
            }
        }

        fetchGitHubRepos();
    </script>
</body>
</html>
